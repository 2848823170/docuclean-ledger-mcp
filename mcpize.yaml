version: 1
name: docuclean-ledger-mcp
description: Deterministic bank, Alipay, WeChat Pay, and Stripe statement + electronic invoice reconciliation, multi-page PDF/HTML table extraction to OpenXML .xlsx, and CJK CSV mojibake repair.
runtime: container
entry: src/index.js

build:
  dockerfile: Dockerfile

startCommand:
  type: http
  command: node
  args:
    - src/index.js
    - --http

bridge:
  mode: http

pricing:
  protocol: x402
  network: base
  recipient: "0xfEbDbB880C7f323c145d61683874a45540208a68"
  asset: usdc
  tools:
    - name: reconcile_statements_and_invoices
      price: "0.02"
      description: Reconcile Alipay, WeChat Pay, Stripe, and bank statements against electronic invoices into a 3-sheet OpenXML .xlsx audit workbook and UTF-8 BOM CSV.
    - name: extract_and_clean_pdf_tables_to_xlsx
      price: "0.02"
      description: Extract and clean multi-page PDF, HTML, Markdown, or JSON tables into formula-ready OpenXML .xlsx and UTF-8 BOM CSV.
    - name: repair_cjk_csv_mojibake
      price: "0.01"
      description: Detect and repair broken GB18030, GBK, Big5, Shift-JIS, EUC-KR, UTF-16, and UTF8-as-Latin1 CJK CSV files with OWASP DDE protection.
